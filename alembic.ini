# One Alembic environment for the whole system. Each context keeps its own migrations next to its
# code (infrastructure/migrations/versions) and its own branch label; this file lists them.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
# Add each context's versions folder here, separated by a semicolon (on every OS).
version_locations = %(here)s/src/pharmavique/catalog/infrastructure/migrations/versions;%(here)s/src/pharmavique/search/infrastructure/migrations/versions;%(here)s/src/pharmavique/knowledge/infrastructure/migrations/versions
path_separator = ;
# The URL comes from PHARMAVIQUE_DATABASE_URL (see migrations/env.py); never put it in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
