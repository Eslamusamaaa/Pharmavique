# The daily refresh of the SFDA data into the production database (Neon).
# Why it runs here: it needs a browser and about two hours, which Vercel does not give. See
# docs/SCRAPING_ON_GITHUB.md. A failed run makes the job fail, and GitHub e-mails the owner.
# Third-party actions are pinned to a commit.
name: Daily refresh

on:
  schedule:
    # 01:17 UTC, 04:17 in Saudi Arabia. Not on the hour: GitHub delays or drops scheduled runs
    # at the start of an hour when it is busy (the run of 2026-11-23 started 7.5 hours late and
    # the one of 2026-11-24 had not started 7.5 hours after 01:00).
    - cron: "17 1 * * *"
    # 13:17 UTC (16:17 in Saudi Arabia): the shortage lists a second time, quick check first
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "steps to run: drugs, lists or drugs,lists (add weekly, monthly for the slow lists; names alone stores the look-alike names)"
        default: "drugs,lists"
      fast_lists:
        description: "lists to crawl (a short trial: drug-shortage)"
        default: "drug-shortage,drug-shortage-resolved,safety-alert,safety-labeling,drugs-circulars,dhpc,rmm,drug-approvals"

# two runs must never overlap: they would write to the same database and the same state
concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PHARMAVIQUE_DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
      PHARMAVIQUE_JWT_SECRET: ${{ secrets.PHARMAVIQUE_JWT_SECRET }}
      PHARMAVIQUE_PUBLIC_URL: https://pharmavique.vercel.app
      PHARMAVIQUE_OPENROUTER_API_KEY: ${{ secrets.PHARMAVIQUE_OPENROUTER_API_KEY }}
      PHARMAVIQUE_CLOUDFLARE_API_TOKEN: ${{ secrets.PHARMAVIQUE_CLOUDFLARE_API_TOKEN }}
      PHARMAVIQUE_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PHARMAVIQUE_CLOUDFLARE_ACCOUNT_ID }}
      PHARMAVIQUE_EMAIL_BACKEND: ${{ secrets.PHARMAVIQUE_EMAIL_BACKEND || 'console' }}
      PHARMAVIQUE_EMAIL_FROM: ${{ secrets.PHARMAVIQUE_EMAIL_FROM || 'Pharmavique <no-reply@localhost>' }}
      PHARMAVIQUE_SMTP_HOST: ${{ secrets.PHARMAVIQUE_SMTP_HOST }}
      PHARMAVIQUE_SMTP_PORT: ${{ secrets.PHARMAVIQUE_SMTP_PORT || '587' }}
      PHARMAVIQUE_SMTP_USERNAME: ${{ secrets.PHARMAVIQUE_SMTP_USERNAME }}
      PHARMAVIQUE_SMTP_PASSWORD: ${{ secrets.PHARMAVIQUE_SMTP_PASSWORD }}
      # the noon schedule reads only the shortage lists; the night one reads everything
      STEPS: ${{ github.event.schedule == '17 13 * * *' && 'lists' || inputs.steps || 'drugs,lists' }}
      FAST_LISTS: ${{ github.event.schedule == '17 13 * * *' && 'drug-shortage,drug-shortage-resolved' || inputs.fast_lists || 'drug-shortage,drug-shortage-resolved,safety-alert,safety-labeling,drugs-circulars,dhpc,rmm,drug-approvals' }}
    steps:
      - name: The database address is set
        run: |
          if [ -z "$PHARMAVIQUE_DATABASE_URL" ]; then
            echo "::error::the secret NEON_DIRECT_URL is not set"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies and Chromium
        run: |
          uv sync --frozen --extra scraper
          uv run playwright install --with-deps chromium

      # What the last runs read: the next run compares with the latest complete one (a drug missing
      # from two complete runs in a row is withdrawn). Without it the run falls back to the committed
      # baseline.
      - name: Restore what the last runs read
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/sfda/update-*
            data/sfda/latest.json
            data/sfda/loaded.json
            data/lists/*/lists-20*
            data/lists/*/know-20*
          key: refresh-state-${{ github.run_id }}
          restore-keys: refresh-state-

      # A copy of what the refresh may change, kept for two days. These schemas hold only public
      # registry data (the same data is committed under data/db). People's accounts are not in them.
      # Only before the run that loads drugs, and without `knowledge` (about 50 MB compressed, far
      # more on the wire): its refresh only adds rows, never changes or deletes them. Every byte a
      # copy reads leaves Neon and counts against the free plan's monthly transfer.
      - name: Copy the database before the refresh
        if: contains(env.STEPS, 'drugs')
        run: |
          mkdir -p backup
          for schema in catalog search interactions; do
            docker run --rm -e PHARMAVIQUE_DATABASE_URL postgres:18 sh -c               'pg_dump "$PHARMAVIQUE_DATABASE_URL" --schema="$1" --format=custom --compress=9 --no-owner --no-privileges'               sh "$schema" > "backup/$schema.dump"
          done
          ls -l backup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(env.STEPS, 'drugs')
        with:
          name: database-before-refresh
          path: backup
          retention-days: 2

      - name: Refresh
        run: bash scripts/daily_refresh.sh

      - name: What happened
        if: always()
        run: |
          {
            echo "## Daily refresh"
            cat data/refresh/*/summary.md 2>/dev/null || echo "no summary was written"
            echo
            cat data/refresh/ATTENTION.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-logs
          path: |
            data/refresh
            data/sfda/update-*/manifest.json
            data/sfda/update-*/changes.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Keep what was read for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/sfda/update-*
            data/sfda/latest.json
            data/sfda/loaded.json
            data/lists/*/lists-20*
            data/lists/*/know-20*
          key: refresh-state-${{ github.run_id }}
