# A read-only look at the production database, started by hand. It writes nothing.
name: Database check

on:
  workflow_dispatch:
    inputs:
      registers:
        description: "register numbers whose shortage links to print"
        default: "0207245466 1902244942"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHARMAVIQUE_DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/db_check_shortage.py ${{ inputs.registers }}
      - run: uv run python scripts/db_schema_fingerprint.py > fingerprint.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-fingerprint
          path: fingerprint.txt
          retention-days: 2
      - run: uv run python scripts/db_damage_report.py
