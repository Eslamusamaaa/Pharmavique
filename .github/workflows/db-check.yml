# A read-only look at the production database, started by hand. It writes nothing.
name: Database check

on:
  workflow_dispatch:
    inputs:
      registers:
        description: "register numbers whose shortage links to print"
        default: "0207245466 1902244942"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHARMAVIQUE_DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/db_check_shortage.py ${{ inputs.registers }}
