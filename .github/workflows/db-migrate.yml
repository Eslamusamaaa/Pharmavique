# Apply the database migrations to the production database (Neon), started by hand.
# A copy of the catalog schema is kept for two days first. It never runs at the same time as the
# daily refresh: they share one concurrency group.
name: Database migrate

on:
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PHARMAVIQUE_DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Report what the migrations would remove
        run: uv run python scripts/db_damage_report.py
      - name: Copy the catalog schema first
        run: |
          mkdir -p backup
          docker run --rm -e PHARMAVIQUE_DATABASE_URL postgres:18 sh -c \
            'pg_dump "$PHARMAVIQUE_DATABASE_URL" --schema=catalog --format=custom --compress=9 --no-owner --no-privileges' \
            > backup/catalog.dump
          ls -l backup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-before-migration
          path: backup
          retention-days: 2
      - name: Migrate
        run: uv run alembic upgrade heads
      - name: Report again
        run: uv run python scripts/db_damage_report.py
