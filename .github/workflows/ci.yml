# Third-party actions are pinned to a commit (Dependabot proposes updates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # a new vulnerability can be published for a dependency that did not change: look weekly
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src tests

      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -m "not integration" --cov --cov-report=term-missing

  # Security gates (owner's decision, 2026-11-25): any finding stops the build. Fix it, or write the
  # exception down with its reason (`[tool.bandit]` in pyproject.toml, `.gitleaksignore`).
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Code scan (bandit, medium severity and above)
        run: uv run bandit -c pyproject.toml -r src scripts -ll -q

      - name: Known vulnerabilities in the locked dependencies (pip-audit)
        run: |
          uv export --frozen --no-hashes --all-extras --no-emit-project -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --no-deps --disable-pip

      - name: Secrets in the code and its history (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0             git /repo --no-banner --redact --verbose --log-opts="--all"
