# Load the picture mapping (data/media/mapping.jsonl) into the production database (Neon), by hand.
# It replaces the picture rows of the catalog with the committed mapping; the picture files
# themselves are in the public bucket (scripts/upload_pictures_to_bucket.py). It never runs at the
# same time as the daily refresh: they share one concurrency group.
name: Pictures load

on:
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHARMAVIQUE_DATABASE_URL: ${{ secrets.NEON_DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python -m pharmavique.bootstrap.cli sfda-pictures-load
