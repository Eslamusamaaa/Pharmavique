# THE ALLOW-LIST: the ignore_imports block IS the context map. Every cross-context edge
# must be listed here, from an adapter module to the provider's `contracts` package only.
# Phase 1 adds the real entries (examples in docs/REPOSITORY_STRUCTURE.md, contract C3).
# unmatched_ignore_imports_alerting stays "error" so dead entries are caught.
[[tool.importlinter.contracts]]
id = "context-independence"
name = "Contexts do not import each other except through allow-listed contracts edges"
type = "independence"
modules = [
    "pharmavique.catalog",
    "pharmavique.ingestion",
    "pharmavique.search",
    "pharmavique.substitution",
    "pharmavique.recognition",
    "pharmavique.assistant",
    "pharmavique.voice",
    "pharmavique.knowledge",
    "pharmavique.media",
    "pharmavique.identity",
    "pharmavique.watchlist",
    "pharmavique.analytics",
    "pharmavique.interactions",
]
ignore_imports = [
    # sync calls from outbound adapters in infrastructure: ingestion speaks the catalog's contracts
    "pharmavique.ingestion.infrastructure.connectors.sfda_web.mapping -> pharmavique.catalog.contracts.commands",
    "pharmavique.ingestion.infrastructure.adapters.catalog_writer -> pharmavique.catalog.contracts.commands",
    "pharmavique.search.infrastructure.catalog_source -> pharmavique.catalog.contracts.queries",
    "pharmavique.analytics.infrastructure.catalog_source -> pharmavique.catalog.contracts.queries",
]
unmatched_ignore_imports_alerting = "error"

