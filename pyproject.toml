[project]
name = "pharmavique"
version = "0.1.0"
description = "Drug intelligence platform (Egypt + Saudi Arabia): modular monolith, DDD, onion architecture."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "playwright>=1.65.2",
    "beautifulsoup4>=4.15.0",
    "pypdf>=7.1.1",
    "langgraph>=1.2.22",
    "langchain-openai>=1.8.2",
    "python-multipart>=0.0.34",
    "pyjwt>=2.8",
]

[project.scripts]
pharmavique = "pharmavique.bootstrap.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmavique"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# one-off analysis helpers kept for reference (scripts/tools/README.md); not product code
extend-exclude = ["scripts/tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF", "C4", "PT"]
# N818: domain-language exception names (InvariantViolation, SourceBlocked) read better without "Error"
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Arabic and Latin look-alike characters are the point of these tests
"tests/unit/search/**" = ["RUF001", "RUF003"]
"tests/unit/shared_kernel/test_text.py" = ["RUF001", "RUF003"]
"tests/unit/media/**" = ["RUF001", "RUF003"]
"src/pharmavique/shared_kernel/text.py" = ["RUF001"]
# Alembic files are loaded by path, not imported, so their names may start with a digit
"**/migrations/versions/*.py" = ["N999"]
"migrations/env.py" = ["INP001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict where the brief requires it: domain and application, plus the published language.
[[tool.mypy.overrides]]
module = [
    "pharmavique.shared_kernel",
    "pharmavique.shared_kernel.*",
    "pharmavique.*.domain",
    "pharmavique.*.domain.*",
    "pharmavique.*.application",
    "pharmavique.*.application.*",
    "pharmavique.*.contracts",
    "pharmavique.*.contracts.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -p pv_isolation"
markers = [
    "integration: needs Postgres/Redis (docker compose up -d db redis)",
]

[tool.coverage.run]
source = ["pharmavique"]
branch = true

# ---------------------------------------------------------------- import-linter
# Generated block below. Contract rationale: docs/REPOSITORY_STRUCTURE.md section 2.

[tool.importlinter]
root_packages = [
    "pharmavique",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "redis",
    "arq",
    "httpx",
    "alembic",
    "playwright",
    "bs4",
]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "onion-layers"
name = "Dependencies point inward inside each bounded context"
type = "layers"
layers = ["presentation", "infrastructure", "application", "domain"]
containers = [
    "pharmavique.catalog",
    "pharmavique.ingestion",
    "pharmavique.search",
    "pharmavique.substitution",
    "pharmavique.recognition",
    "pharmavique.assistant",
    "pharmavique.voice",
    "pharmavique.knowledge",
    "pharmavique.media",
    "pharmavique.identity",
    "pharmavique.watchlist",
    "pharmavique.analytics",
    "pharmavique.interactions",
]

[[tool.importlinter.contracts]]
id = "presentation-isolation"
name = "Presentation must not import infrastructure or domain"
type = "forbidden"
# only direct imports are forbidden: presentation uses application, which uses the domain
allow_indirect_imports = true
source_modules = [
