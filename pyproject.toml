[project]
name = "pharmavique"
version = "0.1.0"
description = "Drug intelligence platform (Egypt + Saudi Arabia): modular monolith, DDD, onion architecture."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmavique"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true

# Strict where the brief requires it: domain and application, plus the published language.
[[tool.mypy.overrides]]
module = [
    "pharmavique.shared_kernel",
    "pharmavique.shared_kernel.*",
    "pharmavique.*.domain",
    "pharmavique.*.domain.*",
    "pharmavique.*.application",
    "pharmavique.*.application.*",
    "pharmavique.*.contracts",
    "pharmavique.*.contracts.*",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true
warn_return_any = true
strict_equality = true
extra_checks = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Postgres/Redis (docker compose up -d db redis)",
]

[tool.coverage.run]
source = ["pharmavique"]
branch = true

# ---------------------------------------------------------------- import-linter
# Generated block below. Contract rationale: docs/REPOSITORY_STRUCTURE.md section 2.

[tool.importlinter]
root_packages = [
    "pharmavique",
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "redis",
    "arq",
    "httpx",
    "alembic",
]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "onion-layers"
name = "Dependencies point inward inside each bounded context"
type = "layers"
layers = ["presentation", "infrastructure", "application", "domain"]
containers = [
    "pharmavique.catalog",
    "pharmavique.ingestion",
    "pharmavique.search",
    "pharmavique.substitution",
    "pharmavique.recognition",
    "pharmavique.knowledge",
    "pharmavique.identity",
    "pharmavique.watchlist",
    "pharmavique.analytics",
]

[[tool.importlinter.contracts]]
id = "presentation-isolation"
name = "Presentation must not import infrastructure or domain"
type = "forbidden"
source_modules = [
    "pharmavique.catalog.presentation",
    "pharmavique.ingestion.presentation",
    "pharmavique.search.presentation",
    "pharmavique.substitution.presentation",
    "pharmavique.recognition.presentation",
    "pharmavique.knowledge.presentation",
    "pharmavique.identity.presentation",
    "pharmavique.watchlist.presentation",
    "pharmavique.analytics.presentation",
]
forbidden_modules = [
    "pharmavique.catalog.infrastructure",
    "pharmavique.ingestion.infrastructure",
    "pharmavique.search.infrastructure",
    "pharmavique.substitution.infrastructure",
    "pharmavique.recognition.infrastructure",
    "pharmavique.knowledge.infrastructure",
    "pharmavique.identity.infrastructure",
    "pharmavique.watchlist.infrastructure",
    "pharmavique.analytics.infrastructure",
    "pharmavique.catalog.domain",
    "pharmavique.ingestion.domain",
    "pharmavique.search.domain",
    "pharmavique.substitution.domain",
    "pharmavique.recognition.domain",
    "pharmavique.knowledge.domain",
    "pharmavique.identity.domain",
    "pharmavique.watchlist.domain",
    "pharmavique.analytics.domain",
]

[[tool.importlinter.contracts]]
id = "infrastructure-not-presentation"
name = "Infrastructure must not import presentation"
type = "forbidden"
source_modules = [
    "pharmavique.catalog.infrastructure",
    "pharmavique.ingestion.infrastructure",
    "pharmavique.search.infrastructure",
    "pharmavique.substitution.infrastructure",
    "pharmavique.recognition.infrastructure",
    "pharmavique.knowledge.infrastructure",
    "pharmavique.identity.infrastructure",
    "pharmavique.watchlist.infrastructure",
    "pharmavique.analytics.infrastructure",
]
forbidden_modules = [
    "pharmavique.catalog.presentation",
    "pharmavique.ingestion.presentation",
    "pharmavique.search.presentation",
    "pharmavique.substitution.presentation",
    "pharmavique.recognition.presentation",
    "pharmavique.knowledge.presentation",
    "pharmavique.identity.presentation",
    "pharmavique.watchlist.presentation",
    "pharmavique.analytics.presentation",
]

# THE ALLOW-LIST: the ignore_imports block IS the context map. Every cross-context edge
# must be listed here, from an adapter module to the provider's `contracts` package only.
# Phase 1 adds the real entries (examples in docs/REPOSITORY_STRUCTURE.md, contract C3).
# unmatched_ignore_imports_alerting stays "error" so dead entries are caught.
[[tool.importlinter.contracts]]
id = "context-independence"
name = "Contexts do not import each other except through allow-listed contracts edges"
type = "independence"
modules = [
    "pharmavique.catalog",
    "pharmavique.ingestion",
    "pharmavique.search",
    "pharmavique.substitution",
    "pharmavique.recognition",
    "pharmavique.knowledge",
    "pharmavique.identity",
    "pharmavique.watchlist",
    "pharmavique.analytics",
]
ignore_imports = []
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "domain-purity"
name = "Domain, application and shared kernel are framework-free"
type = "forbidden"
source_modules = [
    "pharmavique.catalog.domain",
    "pharmavique.ingestion.domain",
    "pharmavique.search.domain",
    "pharmavique.substitution.domain",
    "pharmavique.recognition.domain",
    "pharmavique.knowledge.domain",
    "pharmavique.identity.domain",
    "pharmavique.watchlist.domain",
    "pharmavique.analytics.domain",
    "pharmavique.catalog.application",
    "pharmavique.ingestion.application",
    "pharmavique.search.application",
    "pharmavique.substitution.application",
    "pharmavique.recognition.application",
    "pharmavique.knowledge.application",
    "pharmavique.identity.application",
    "pharmavique.watchlist.application",
    "pharmavique.analytics.application",
    "pharmavique.shared_kernel",
]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "starlette",
    "pydantic",
    "redis",
    "arq",
    "httpx",
    "alembic",
    "pharmavique.foundation",
]
allow_indirect_imports = true

